<!doctype html>
<html lang="th">
<head>
  <meta name="qa-page" content="profile">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Profile</title>
  <script src="app-release.js?v=serial-20261103" ></script><script src="config.js?v=release-20261026-v3"></script>
  <script src="workflow-rules.js?v=handoff-20261030"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-api.js?v=web-push-20261124-r11"></script>
  <script src="navigation.js?v=launch-20261030"></script>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#f4f6f8;color:#1f2937}
    .page{max-width:820px;margin:auto;padding:30px 20px}.head{margin-bottom:18px}.head h1{margin:0 0 6px}.muted{color:#64748b}
    .card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:22px;margin-bottom:16px;box-shadow:0 4px 14px rgba(15,23,42,.04)}
    .row{display:grid;grid-template-columns:150px 1fr;gap:10px;padding:9px 0;border-bottom:1px solid #f1f5f9}.row:last-child{border-bottom:0}.label{font-weight:800;color:#475569}
    [hidden],.hidden{display:none!important}
    button:focus-visible{outline:3px solid #4583c0;outline-offset:3px}
    .push-row{display:flex;align-items:center;justify-content:space-between;gap:16px}
    .push-row h2{font-size:18px;margin:0}
    .push-row p{font-size:14px;margin:5px 0 0;color:#465d76}
    .push-status{margin:10px 0 0;font-size:14px;color:#465d76}
    .push-status:empty{display:none}
    #webPushToggle{display:flex;align-items:center;box-sizing:border-box;flex:none;width:48px;height:28px;padding:3px;border:1px solid #7b8da1;border-radius:99px;background:#a4b6c9;cursor:pointer}
    #webPushToggle::before{content:"";width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .16s}
    #webPushToggle[aria-checked="true"]{background:#245b96;border-color:#245b96}
    #webPushToggle[aria-checked="true"]::before{transform:translateX(20px)}
    #webPushToggle:disabled{opacity:.55;cursor:default}
    .row>div{min-width:0;overflow-wrap:anywhere}
    @media(max-width:600px){.page{padding:22px 14px}.card{padding:18px}.row{grid-template-columns:1fr;gap:3px}}
  </style>
<link rel="manifest" href="web-push.webmanifest"><link rel="apple-touch-icon" href="web-push-icon-192.png"></head>
<body class="qa-auth-loading">
<main class="page">
  <div class="head"><h1>Profile</h1><div class="muted">ข้อมูลบัญชี</div></div>

  <section class="card">
    <div class="row"><div class="label">ชื่อ</div><div id="displayName">-</div></div>
    <div class="row"><div class="label">Role</div><div id="role">-</div></div>
    <div class="row"><div class="label">Department</div><div id="department">-</div></div>
  </section>

  <section class="card" aria-labelledby="webPushHeading">
    <div class="push-row">
      <div><h2 id="webPushHeading">รับแจ้งเตือนบนเครื่องนี้</h2><p>งานเข้าแผนก งานรอตรวจ และงานที่ต้องแก้ไข</p></div>
      <button id="webPushToggle" type="button" role="switch" aria-labelledby="webPushHeading"
        aria-describedby="webPushStatus" aria-checked="false" disabled></button>
    </div>
    <p id="webPushStatus" class="push-status" role="status">กำลังโหลด...</p>
  </section>
</main>
<script>
document.addEventListener('DOMContentLoaded', () => {
  QA.whenReady().then(() => {
    const p = QA.profile;
    document.getElementById('displayName').textContent = p.display_name || '-';
    document.getElementById('role').textContent = String(p.role || '-').replaceAll('_', ' ');
    document.getElementById('department').textContent = p.department || 'ไม่สังกัดแผนก';
  }).catch(() => {});
});
</script>
<script src="web-push-profile.js?v=web-push-20261124-r11" defer></script>
</body>
</html>
